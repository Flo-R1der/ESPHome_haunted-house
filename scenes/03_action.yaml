


script:
  - id: scenes_action   # DISPATCHER
    mode: restart
    parameters:
      requested_scene: int
      # 0 = random selection
      # 1-n = activate specific scene
    then:
      - lambda: 'id(scene_type_running) = 3;'
      - lambda: |-
          ESP_LOGV("scenes_action", "received scene request: %d", requested_scene);
          int selected_scene = requested_scene;
          if (requested_scene == 0) {
            // define the available scene numbers
            int scenes[] = {5, 8, 16, 20, 21, 25, 33, 38, 39, 44};   // <-- updates on add/remove of scenes
            int array_size = sizeof(scenes) / sizeof(scenes[0]);
            // randomly select a scene from the available scenes
            selected_scene = scenes[rand() % array_size];
            ESP_LOGI("scenes_action", "selected scene No: %d", selected_scene);
          }
          // Set the global variable to the selected scene number
          id(scene_running) = selected_scene;
      - lambda: |-
          int selected_scene = id(scene_running);
          if (selected_scene == 5) { id(_05_cemetery_wind).execute();
          // } else if (selected_scene == 8) { id(_08_ghostly_whispers).execute();
          // } else if (selected_scene == 16) { id(_16_eerie_piano).execute();
          // } else if (selected_scene == 20) { id(_20_creaking_door).execute();
          // } else if (selected_scene == 21) { id(_21_wind_howl).execute();
          // } else if (selected_scene == 25) { id(_25_thunder_clap).execute();
          // } else if (selected_scene == 33) { id(_33_wind_howl).execute();
          // } else if (selected_scene == 38) { id(_38_thunder_clap).execute();
          // } else if (selected_scene == 39) { id(_39_ghostly_laughter).execute();
          // } else if (selected_scene == 44) { id(_44_suspenseful_strings).execute();
          } else {   // ^-- updates on add/remove of scenes --^ //
            ESP_LOGW("scenes_action", "this script don't know a scene No: %d", selected_scene);
          }


  - id: stop_action_scene
    mode: single
    then:
      - script.stop: _05_cemetery_wind


  - id: _05_cemetery_wind
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 13   # duration of the scene
      - dfplayer.play_folder:
          folder: 03
          file: 05

