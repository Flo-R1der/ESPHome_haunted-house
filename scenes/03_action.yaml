# IMPORTANT: when adding or removing scenes, update:
# - int scenes[] = {...};
# - id(selected_scene).execute;
# - script: stop_approach_scene


script:
  - id: scenes_action   # DISPATCHER
    mode: restart
    parameters:
      requested_scene: int
      # 0 = random selection
      # 1-n = activate specific scene
    then:
      - lambda: 'id(scene_type_running) = 3;'
      - lambda: |-
          ESP_LOGV("scenes_action", "received scene request: %d", requested_scene);
          int selected_scene = requested_scene;
          if (requested_scene == 0) {
            // define the available scene numbers
            int scenes[] = {5, 8, 16, 20, 21, 25, 33, 38, 39, 44};   // <-- updates on add/remove of scenes
            int array_size = sizeof(scenes) / sizeof(scenes[0]);
            // randomly select a scene from the available scenes
            selected_scene = scenes[rand() % array_size];
            ESP_LOGI("scenes_action", "selected scene No: %d", selected_scene);
          }
          // Set the global variable to the selected scene number
          id(scene_running) = selected_scene;
      - lambda: |-
          int selected_scene = id(scene_running);
          if (selected_scene == 5) { id(_05_cemetery_wind).execute();
          } else if (selected_scene == 8) { id(_08_winter_wind).execute();
          } else if (selected_scene == 16) { id(_16_whispering_voices).execute();
          } else if (selected_scene == 20) { id(_20_scream).execute();
          // } else if (selected_scene == 21) { id(_21_wind_howl).execute();
          // } else if (selected_scene == 25) { id(_25_thunder_clap).execute();
          // } else if (selected_scene == 33) { id(_33_wind_howl).execute();
          // } else if (selected_scene == 38) { id(_38_thunder_clap).execute();
          // } else if (selected_scene == 39) { id(_39_ghostly_laughter).execute();
          // } else if (selected_scene == 44) { id(_44_suspenseful_strings).execute();
          } else {   // ^-- updates on add/remove of scenes --^ //
            ESP_LOGW("scenes_action", "this script don't know a scene No: %d", selected_scene);
          }


  - id: stop_action_scene
    mode: single
    then:
      - script.stop: _05_cemetery_wind
      - script.stop: _08_winter_wind
      - script.stop: _16_whispering_voices
      - script.stop: _20_scream


  - id: _05_cemetery_wind
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 13   # duration of the scene
      - dfplayer.play_folder:
          folder: 03
          file: 05
      - fan.turn_on: fan_livingroom
      - script.execute:
          id: partition_light
          partition_bits: 10
          brightness: 70
          red: 220
          green: 0
          blue: 255
          transition_millis: 1000
      - delay: 1s
      - light.turn_on:
          id: power_led_2
          effect: flicker
          brightness: 30%
      - delay: 3s
      - light.turn_on:
          id: led_attic
          brightness: 70%
          red: 90%
          green: 0%
          blue: 100%
      - delay: 5s
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 25%
      - light.turn_off:
          id: power_led_2

  - id: _08_winter_wind
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 20   # duration of the scene
      - dfplayer.play_folder:
          folder: 03
          file: 08
      - fan.turn_on: fan_livingroom
      - script.execute:
          id: partition_light
          partition_bits: 9
          brightness: 70
          red: 220
          green: 0
          blue: 255
          transition_millis: 1000
      - delay: 1s
      - light.turn_on:
          id: power_led_1
          effect: flicker
          brightness: 20%
      - delay: 5s
      - light.turn_on:
          id: power_led_3
          effect: flicker
          brightness: 20%
      - delay: 5s
      - light.turn_on:
          id: led_livingroom
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          effect: Firework
      - light.turn_on:
          id: led_basement
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          effect: Firework
      - light.turn_off:
          id: power_led_1

  - id: _16_whispering_voices
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 19   # duration of the scene
      - number.set:
          id: volume
          value: 100   # will be reset by the stop script
      - globals.set:
          id: color_wandering_length_ms
          value: '6500'
      - globals.set:
          id: color_wandering_reversed
          value: 'true'
      - delay: 50ms
      - dfplayer.play_folder:
          folder: 03
          file: 16
      - light.turn_on:
          id: led_basement
          brightness: 100%
          red: 80%
          green: 0%
          blue: 100%
          effect: "Color Wandering"
      - delay: 6s
      - light.turn_off:
          id: led_basement
          transition_length: 1s
      - light.turn_on:
          id: led_livingroom
          brightness: 100%
          red: 80%
          green: 0%
          blue: 100%
          effect: "Color Wandering"
      - light.turn_on:
          id: power_led_3
          effect: flicker
          brightness: 20%
      - delay: 6s
      - light.turn_off:
          id: led_basement
      - light.turn_on:
          id: led_attic
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          effect: "Firework"

  - id: _20_scream
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 6   # duration of the scene
      - number.set:
          id: volume
          value: 100   # will be reset by the stop script
      - dfplayer.play_folder:
          folder: 03
          file: 20
      - script.execute:
          id: partition_light
          partition_bits: 15
          brightness: 70
          red: 255
          green: 0
          blue: 0
          transition_millis: 1500
      - delay: 1500ms
      - script.execute:
          id: thunder
          pause_array: [200, 500, 200, 250, 400]
          power_led_no: 1
      - delay: 300ms
      - script.execute:
          id: thunder
          pause_array: [300, 500, 250, 300]
          power_led_no: 3
      - delay: 200ms
      - script.execute:
          id: thunder
          pause_array: [200, 300, 400]
          power_led_no: 5


