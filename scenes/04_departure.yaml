


script:
  - id: scenes_departure   # DISPATCHER
    mode: restart
    parameters:
      requested_scene: int
      # 0 = random selection
      # 1-n = activate specific scene
    then:
      - lambda: |-
          ESP_LOGV("scenes_departure", "received scene request: %d", requested_scene);
          int selected_scene = requested_scene;
          if (requested_scene == 0) {
            // define the available scene numbers
            int scenes[] = {1, 14, 15, 23, 28, 46, 48};   // <-- updates on add/remove of scenes
            int array_size = sizeof(scenes) / sizeof(scenes[0]);
            // randomly select a scene from the available scenes
            selected_scene = scenes[rand() % array_size];
            ESP_LOGI("scenes_departure", "selected scene No: %d", selected_scene);
          }
          // Set the global variable to the selected scene number
          id(scene_running) = selected_scene;
      - lambda: |-
          int selected_scene = id(scene_running);
          if (selected_scene == 1) { id(_01_witch_laugh).execute();
          // } else if (selected_scene == 14) { id(_14_ghostly_whispers).execute();
          // } else if (selected_scene == 15) { id(_15_eerie_piano).execute();
          // } else if (selected_scene == 23) { id(_23_creaking_door).execute();
          // } else if (selected_scene == 28) { id(_28_wind_howl).execute();
          // } else if (selected_scene == 46) { id(_46_thunder_clap).execute();
          // } else if (selected_scene == 48) { id(_48_ghostly_laughter).execute();
          } else {   // ^-- updates on add/remove of scenes --^ //
            ESP_LOGW("scenes_departure", "this script don't know a scene No: %d", selected_scene);
          }


  - id: _01_witch_laugh
    mode: single 
    then:
      - script.execute: stop_scene
      - dfplayer.play_folder:
          folder: 04
          file: 01

