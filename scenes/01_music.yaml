


script:
  - id: scenes_music   # DISPATCHER
    mode: restart
    parameters:
      requested_scene: int
      # 0 = random selection
      # 1-n = activate specific scene
    then:
      - lambda: 'id(scene_type_running) = 1;'
      - lambda: |-
          ESP_LOGV("scenes_music", "received scene request: %d", requested_scene);
          int selected_scene = requested_scene;
          if (requested_scene == 0) {
            // define the available scene numbers
            int scenes[] = {10, 12, 37, 50, 51, 52, 53, 54};   // <-- updates on add/remove of scenes
            int array_size = sizeof(scenes) / sizeof(scenes[0]);
            // randomly select a scene from the available scenes
            selected_scene = scenes[rand() % array_size];
            ESP_LOGI("scenes_music", "selected scene no: %d", selected_scene);
          }
          // Set the global variable to the selected scene number
          id(scene_running) = selected_scene;
      - lambda: |-
          int selected_scene = id(scene_running);
          if (selected_scene == 10) { id(_10_horror_orchestra).execute();
          } else if (selected_scene == 12) { id(_12_music_box).execute();
          } else if (selected_scene == 37) { id(_37_music_box).execute();
          } else if (selected_scene == 50) { id(_50_thriller).execute();
          // } else if (selected_scene == 51) { id(_51_wind_howl).execute();
          // } else if (selected_scene == 52) { id(_52_thunder_clap).execute();
          // } else if (selected_scene == 53) { id(_53_ghostly_laughter).execute();
          // } else if (selected_scene == 54) { id(_54_suspenseful_strings).execute();
          } else {   // ^-- updates on add/remove of scenes --^ //
            ESP_LOGW("scenes_music", "this script don't know a scene No: %d", selected_scene);
          }


  - id: stop_music_scene
    mode: single
    then:
      - script.stop: _10_horror_orchestra
      - script.stop: _12_music_box
      - script.stop: _37_music_box
      - script.stop: _50_thriller


  - id: _10_horror_orchestra
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 77   # duration of the scene
      - dfplayer.play_folder:
          folder: 01
          file: 10     # track / scene number
      - light.turn_on:
          id: power_led_1
          effect: flicker
          brightness: 25%
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 25%
      - light.turn_on:
          id: led_basement
          transition_length: 1s
          brightness: 90%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: led_livingroom
          transition_length: 1s
          brightness: 90%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: led_attic
          brightness: 90%
          transition_length: 1s
          red: 100%
          green: 0%
          blue: 0%

  - id: _12_music_box
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 21   # duration of the scene
      - dfplayer.play_folder:
          folder: 01
          file: 12     # track / scene number
      - globals.set:
          id: color_wandering_length_ms
          value: '6500'
      - globals.set:
          id: color_wandering_reversed
          value: 'true'
      - delay: 50ms   # wait for the global variable to be available
      - light.turn_on:
          id: led_attic
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: led_attic
          effect: "Color Wandering"
      - globals.set:
          id: color_wandering_reversed
          value: 'false'
      - delay: 6s
      - light.turn_off:
          id: led_attic
          transition_length: 1s
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 25%
      - light.turn_on:
          id: led_livingroom
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
      - light.turn_on:
          id: led_livingroom
          effect: "Color Wandering"
      - delay: 5s
      - light.turn_off:
          id: led_livingroom
      - light.turn_on:
          id: led_basement
          brightness: 100%
          red: 95%
          green: 0%
          blue: 100%
      - light.turn_on:
          id: led_basement
          effect: "Color Wandering"
      - light.turn_off:
          id: power_led_4
      - delay: 6.5s
      - light.turn_off:
          id: led_basement
          transition_length: 1s

  - id: _37_music_box
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 32   # duration of the scene
      - dfplayer.play_folder:
          folder: 01
          file: 37     # track / scene number
      - globals.set:
          id: color_wandering_length_ms
          value: '7500'
      - globals.set:
          id: color_wandering_reversed
          value: 'true'
      - delay: 20ms   # wait for the global variable to be available
      - light.turn_on:
          id: led_basement
          brightness: 100%
          red: 95%
          green: 0%
          blue: 100%
      - light.turn_on:
          id: led_basement
          effect: "Color Wandering"
      - delay: 7s
      - light.turn_off:
          id: led_basement
          transition_length: 1s
      - globals.set:
          id: color_wandering_reversed
          value: 'true'
      - delay: 20ms   # wait for the global variable to be available
      - light.turn_on:
          id: led_livingroom
          brightness: 100%
          red: 95%
          green: 0%
          blue: 100%
      - light.turn_on:
          id: led_livingroom
          effect: "Color Wandering"
      - globals.set:
          id: color_wandering_reversed
          value: 'false'
      - delay: 7s
      - light.turn_off:
          id: led_livingroom
          transition_length: 1s
      - light.turn_on:
          id: led_attic
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
      - light.turn_on:
          id: led_attic
          effect: "Color Wandering"
      - delay: 7.5s
      - light.turn_off:
          id: led_attic
          transition_length: 0s
      - script.execute:
          id: thunder
          pause_array: [200, 500]
          power_led_no: 3
      - delay: 300ms
      - script.execute:
          id: thunder
          pause_array: [200]
          power_led_no: 5
      - delay: 2s
      - light.turn_on:
          id: power_led_2
          effect: flicker
          brightness: 20%

  - id: _50_thriller
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 114   # duration of the scene
      - dfplayer.play_folder:
          folder: 01
          file: 50     # track / scene number
      - delay: 2s
      - light.turn_on:
          id: led_livingroom
          transition_length: 6s
          brightness: 100%
          red: 95%
          green: 0%
          blue: 100%
      - delay: 9.5s
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 30%
      - delay: 5.5s
      - light.turn_on:
          id: led_attic
          transition_length: 2s
          brightness: 100%
          red: 95%
          green: 0%
          blue: 100%
      - delay: 6.5s
      - light.turn_on:
          id: power_led_5
          effect: flicker
          brightness: 20%
      - delay: 14.3s   # intro end
      - lambda: |-
          auto call = id(power_led_4).turn_off();
          call.set_transition_length(0).perform();
          call = id(power_led_5).turn_off();
          call.set_transition_length(0).perform();
      - light.turn_on:
          id: led_livingroom
          transition_length: 0s
          brightness: 90%
          red: 100%
          green: 90%
          blue: 100%
      - light.turn_on:
          id: led_attic
          transition_length: 0s
          brightness: 90%
          red: 100%
          green: 80%
          blue: 100%
      - lambda: |-
          auto call = id(power_led_1).turn_on().set_brightness(0.7);
          call.set_effect("none").set_transition_length(100).perform();
          call = id(power_led_2).turn_on().set_brightness(0.7);
          call.set_effect("none").set_transition_length(100).perform();
          call = id(power_led_3).turn_on().set_brightness(0.7);
          call.set_effect("none").set_transition_length(100).perform();
          call = id(power_led_4).turn_on().set_brightness(0.7);
          call.set_effect("none").set_transition_length(100).perform();
          call = id(power_led_5).turn_on().set_brightness(0.7);
          call.set_effect("none").set_transition_length(100).perform();
      - delay: 2.5s
      - lambda: |-
          auto call = id(power_led_1).turn_off();
          call.set_transition_length(4000).perform();
          call = id(power_led_2).turn_off();
          call.set_transition_length(4000).perform();
          call = id(power_led_3).turn_off();
          call.set_transition_length(4000).perform();
          call = id(power_led_4).turn_off();
          call.set_transition_length(4000).perform();
          call = id(power_led_5).turn_off();
          call.set_transition_length(4000).perform();
      - delay: 1.5s
      - light.turn_on:
          id: led_basement
          brightness: 90%
          effect: Rainbow
      - light.turn_on:
          id: led_livingroom
          brightness: 90%
          effect: Rainbow
      - light.turn_on:
          id: led_attic
          brightness: 100%
          effect: Disco
      - delay: 3.6s
      - script.execute:
          id: thunder
          pause_array: [2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030]
          power_led_no: 3
      - script.execute:
          id: thunder
          pause_array: [2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030,2030]
          power_led_no: 4

