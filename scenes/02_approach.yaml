


script:
  - id: scenes_approach   # DISPATCHER
    mode: restart
    parameters:
      requested_scene: int
      # 0 = random selection
      # 1-n = activate specific scene
    then:
      - lambda: 'id(scene_type_running) = 2;'
      - lambda: |-
          ESP_LOGV("scenes_approach", "received scene request: %d", requested_scene);
          int selected_scene = requested_scene;
          if (requested_scene == 0) {
            // define the available scene numbers
            int scenes[] = {2, 6, 7, 9, 19, 24};   // <-- updates on add/remove of scenes
            int array_size = sizeof(scenes) / sizeof(scenes[0]);
            // randomly select a scene from the available scenes
            selected_scene = scenes[rand() % array_size];
            ESP_LOGI("scenes_approach", "selected scene no: %d", selected_scene);
          }
          // Set the global variable to the selected scene number
          id(scene_running) = selected_scene;
      - lambda: |-
          int selected_scene = id(scene_running);
          if (selected_scene == 2) { id(_02_ghost_laugh).execute();
          } else if (selected_scene == 6) { id(_06_harsh_wind).execute();
          } else if (selected_scene == 7) { id(_07_clock_ticking).execute();
          } else if (selected_scene == 9) { id(_09_ghost_whisper).execute();
          // } else if (selected_scene == 19) { id(_19_wind_howl).execute();
          // } else if (selected_scene == 24) { id(_24_thunder_clap).execute();
          } else {   // ^-- updates on add/remove of scenes --^ //
            ESP_LOGW("scenes_approach", "this script don't know a scene No: %d", selected_scene);
          }


  - id: stop_approach_scene
    mode: single
    then:
      - script.stop: _02_ghost_laugh
      - script.stop: _06_harsh_wind
      - script.stop: _07_clock_ticking
      - script.stop: _09_ghost_whisper


  - id: _02_ghost_laugh
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 5   # duration of the scene
      - number.set:
          id: volume
          value: 100   # will be reset by the stop script
      - dfplayer.play_folder:
          folder: 02
          file: 02
      - delay: 1s
      - script.execute:
          id: partition_light
          partition_bits: 8
          brightness: 70
          red: 220
          green: 0
          blue: 255
      - script.execute:
          id: partition_light
          partition_bits: 32
          brightness: 60
          red: 210
          green: 0
          blue: 255
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 35%

  - id: _06_harsh_wind
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 14   # duration of the scene
      - dfplayer.play_folder:
          folder: 02
          file: 06
      - light.turn_on:
          id: power_led_2
          effect: flicker
          brightness: 35%
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 25%
      - delay: 5s
      - light.turn_off:
          id: power_led_4
      - light.turn_on:
          id: power_led_5
          effect: flicker
          brightness: 25%
      - delay: 3s
      - light.turn_on:
          id: led_livingroom
          brightness: 70%
          red: 90%
          green: 0%
          blue: 100%
      - light.turn_on:
          id: led_attic
          brightness: 70%
          red: 90%
          green: 0%
          blue: 100%
      - light.turn_off:
          id: power_led_2

  - id: _07_clock_ticking
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 16.5   # duration of the scene
      - repeat:
          count: 4
          then:
            - dfplayer.play_folder:
                folder: 02
                file: 07
            - light.turn_on:
                id: power_led_1
                effect: flicker
                brightness: 20%
            - light.turn_on:
                id: power_led_4
                effect: flicker
                brightness: 20%
            - delay: 50ms
            - light.turn_on:   # tick 1+5
                id: power_led_5
                brightness: 50%
                effect: flash
            - delay: 1s
            - light.turn_on:   # tick 2+6
                id: led_attic_1
                brightness: 70%
                transition_length: 100ms
                red: 90%
                green: 0%
                blue: 100%
            - delay: 100ms
            - light.turn_off:
                id: led_attic_1
                transition_length: 400ms
            - delay: 900ms
            - light.turn_on:   # tick 3+7
                id: power_led_3
                brightness: 50%
                effect: flash
            - delay: 1s
            - light.turn_on:    # tick 4+8
                id: led_bay_2
                brightness: 70%
                transition_length: 100ms
                red: 90%
                green: 0%
                blue: 100%
            - delay: 100ms
            - light.turn_off:
                id: led_bay_2
                transition_length: 400ms
            - delay: 900ms

  - id: _09_ghost_whisper
    mode: single 
    then:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 17   # duration of the scene
      - dfplayer.play_folder:
          folder: 02
          file: 09
      - script.execute:
          id: partition_light
          partition_bits: 26
          brightness: 70
          red: 220
          green: 0
          blue: 255
      - light.turn_on:
          id: power_led_4
          effect: flicker
          brightness: 25%

