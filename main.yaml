substitutions:
  device_name: "horror-haus"  # only lowercase, numbers, - and _ allowed!
  friendly_name: "Horror-Haus"
  local_domain: ".fritz.box"


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  on_boot:
    - priority: -100
      then:
        - dfplayer.set_volume:
            volume: !lambda "return (int) round(id(volume).state * 30.0 / 100.0);"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption

  actions:
    # Play file from /mp3/xxxx.mp3
    - action: play_mp3
      variables:
        file: int
      then:
        - dfplayer.play_mp3:
            file: !lambda "return file;"
    # Play file from numbered folder, e.g. /01/001.mp3
    - action: play_folder
      variables:
        folder: int
        file: int
      then:
        - dfplayer.play_folder:
            folder: !lambda "return folder;"
            file: !lambda "return file;"
    # Control light partitions of WS2812B RGB LED Strip using bitmask
    - action: partition_light
      variables:
        partition_bits: int
        # 0 = all off
        # bit 0 = led_door
        # bit 1 = led_bay_1
        # bit 2 = led_small_window
        # bit 3 = led_bay_2
        # bit 4 = led_attic_1
        # bit 5 = led_attic_2
        brightness: int   # in %
        red: int     # range: 0-255
        green: int   # range: 0-255
        blue: int    # range: 0-255
      then:
        - script.execute:
            id: partition_light
            partition_bits: !lambda "return partition_bits;"
            brightness: !lambda "return brightness;"
            red: !lambda "return red;"
            green: !lambda "return green;"
            blue: !lambda "return blue;"
            transition_millis: 1000
    # Call the scene_controller script as a sensor trigger would do
    - action: random_scene
      variables:
        scene_type: int
        # 0 = no scene
        # 1 = music only
        # 2 = approach (includes music)
        # 3 = action
        # 4 = departure
      then:
        - script.execute:
            id: scene_controller
            scene_type: !lambda "return scene_type;"
    # request a specific scene to be started
    - action: start_scene
      variables:
        scene_number: int
      then:
        - script.execute:
            id: scene_start_manual
            scene_number: !lambda "return scene_number;"
    # stop running scenes
    - action: stop_scene
      variables:
        stop_waiting_seconds: int
      then:
        - script.execute:
            id: stop_scene
            stop_waiting_seconds: !lambda "return stop_waiting_seconds;"


ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret wifi_wohnzimmer_ssid
    password: !secret wifi_wohnzimmer_password

  domain: "${local_domain}"
  use_address: 192.168.178.169

  output_power: 14dB   # https://esphome.io/guides/faq/#brownout-detector-was-triggered
  
  ap:
    ssid: "${device_name} Hotspot"
    password: !secret hotspot_password

captive_portal:


time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

uart:
  - id: dfplayer_uart
    tx_pin: GPIO3
    rx_pin: GPIO1
    baud_rate: 9600
  - id: uart_ld2410
    tx_pin: GPIO17
    rx_pin: GPIO16
    parity: NONE
    stop_bits: 1
    baud_rate: 256000

dfplayer:
  uart_id: dfplayer_uart
  id: my_dfplayer

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO15
    frequency: 4882Hz


number:
  - platform: template
    name: "Volume"
    id: volume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    set_action:
      - dfplayer.set_volume:
          volume: !lambda "return (int) round(x * 30.0 / 100.0);"

  - platform: template
    name: "Mindesthelligkeit"
    id: light_threshold
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: lx
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50

  - platform: template
    name: "Action Distanz"
    id: action_distance
    entity_category: config
    min_value: 50
    max_value: 300
    step: 10
    unit_of_measurement: cm
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 150

  - platform: template
    name: "Departure Distanz"
    id: departure_distance
    entity_category: config
    min_value: 100
    max_value: 600
    step: 10
    unit_of_measurement: cm
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 300

  - platform: template
    name: "Stop Cooldown"
    id: emergency_stop_cooldown_time
    entity_category: config
    min_value: 0
    max_value: 20
    step: 1
    unit_of_measurement: min
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 5

  - platform: ld2410
    timeout:
      name: "Radar Anwesenheit Timeout"
      entity_category: config

    max_move_distance_gate:
      name: "Radar Max. Bewegungsdistanz"
    max_still_distance_gate:
      name: "Radar Max. statische Distanz"

    g0:
      move_threshold:
        name: "Radar G0 Bewegungsschwelle"
        disabled_by_default: true
      still_threshold:
        name: "Radar G0 statische Schwelle"
        disabled_by_default: true
    g1:
      move_threshold:
        name: "Radar G1 Bewegungsschwelle"
        disabled_by_default: true
      still_threshold:
        name: "Radar G1 statische Schwelle"
        disabled_by_default: true


datetime:
  - platform: template
    id: earliest_trigger
    type: time
    name: Zeit von
    optimistic: yes
    initial_value: "07:00:00"
    restore_value: true
    entity_category: config
  - platform: template
    id: latest_trigger
    type: time
    name: Zeit bis
    optimistic: yes
    initial_value: "23:00:00"
    restore_value: true
    entity_category: config


button:
  - platform: template
    name: "Zufallswiedergabe"
    disabled_by_default: true
    icon: mdi:play
    on_press:
      - dfplayer.random

  - platform: template
    name: "Wiedergabe stoppen"
    disabled_by_default: true
    icon: mdi:stop
    on_press:
      - dfplayer.stop

fan:
  - platform: speed
    output: fan_pwm
    name: "Lüfter"
    id: fan_livingroom
    speed_count: 100

packages:
  - !include lights.yaml
  - !include scenes/00_scene_controller.yaml


globals:
  - id: last_volume
    type: int
    restore_value: yes
    initial_value: '0'


switch:
  - platform: template
    name: "Stop Scene"
    id: stop_request
    optimistic: true
    icon: mdi:pause-box
    turn_on_action:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 0
      - script.wait: stop_scene
      - script.execute: emergency_stop_cooldown

  - platform: ld2410
    engineering_mode:
      name: "Radar Engineering Mode"
      entity_category: config

script:
  - id: emergency_stop_cooldown
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(emergency_stop_cooldown_time).state == 0;"
          then:
            - logger.log:
                format: "No 'Emergency Stop Cooldown' given, STOP is now permanent!"
                level: INFO
            - script.stop: emergency_stop_cooldown
          else:
            - logger.log: 
                format: "'Emergency Stop Cooldown' triggered. Waiting %.0f minute(s)."
                args: ['id(emergency_stop_cooldown_time).state']
                level: INFO
      - delay: 50ms   # wait for the switch 'stop_request' to publish it's state
      - wait_until:
          condition:
            switch.is_off: stop_request
          timeout: !lambda return id(emergency_stop_cooldown_time).state * 1000 * 60;
      - if:
          condition:
            switch.is_off: stop_request
          then:
            - logger.log: 
                format: "'Emergency Stop' is now disabled, resuming normal operation."
                level: INFO
          else:
            - logger.log:
                format: "'Emergency Stop Cooldown' is over, resuming normal operation."
                level: INFO
            - switch.turn_off: stop_request



ld2410:
  uart_id: uart_ld2410

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true


binary_sensor:
  - platform: status
    name: "Status"

  - platform: ld2410
    has_moving_target:
      name: "Radar Bewegtes Ziel"
      id: radar_moving_target
      entity_category: "diagnostic"
    has_still_target:
      name: "Radar Statisches Ziel"
      id: radar_static_target
      entity_category: "diagnostic"

  - platform: template
    name: "Anwesenheit"
    id: presence_sensor
    lambda: |-
      if (id(radar_moving_target).state &&
          id(radar_moving_distance).state > 0 &&
          id(radar_moving_energy).state > 0 ||
          id(radar_static_target).state &&
          id(radar_static_distance).state > 0 &&
          id(radar_static_energy).state > 0 ) {
        return true;
      } else {
        return false;
      }
    filters:
      - delayed_on: 1s
      - delayed_off: 10s
    on_press:
      then:
        - if:
            condition:
              - lambda: |-
                  ESP_LOGI("illumination", "light measured: %f / light threshold: %f",
                    id(ambient_light).state, id(light_threshold).state);
                  return id(ambient_light).state <= id(light_threshold).state;
              - lambda: |-
                  ESP_LOGI("time", "now: %02d:%02d:%02d / earliest trigger: %02d:%02d:%02d / latest trigger: %02d:%02d:%02d",
                           id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second,
                           id(earliest_trigger).hour, id(earliest_trigger).minute, id(earliest_trigger).second,
                           id(latest_trigger).hour, id(latest_trigger).minute, id(latest_trigger).second);
                  return id(within_time_window).state;
              - lambda: |-
                  ESP_LOGI("scene_type", "current scene running: %d", id(scene_type_running));
                  return id(scene_type_running) == 0;   // only trigger, if no scene is running
              - switch.is_off: stop_request
            then:
              - logger.log:
                  format: "APPROACH triggered"
                  level: INFO
                  tag: ld2410_presence
              - script.execute:
                  id: scene_controller
                  scene_type: 2   # 1 = music, 2 = approach + music

  - platform: template
    id: within_time_window
    internal: true
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid()) {
        ESP_LOGW("time", "Current time is not valid yet");
        return false;
      }
      int current_seconds = now.hour * 3600 + now.minute * 60 + now.second;
      int earliest_seconds = id(earliest_trigger).hour * 3600 +
                             id(earliest_trigger).minute * 60 +
                             id(earliest_trigger).second;
      int latest_seconds = id(latest_trigger).hour * 3600 +
                           id(latest_trigger).minute * 60 +
                           id(latest_trigger).second;
      // Also supports windows crossing midnight, e.g. 22:00 to 06:00.
      if (earliest_seconds <= latest_seconds) {
        return current_seconds >= earliest_seconds && current_seconds <= latest_seconds;
      } else {
        return current_seconds >= earliest_seconds || current_seconds <= latest_seconds;
      }

  - platform: gpio
    id: buzzer
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            if (id(scene_running) != 0) {   // this is the emergency stop
              id(stop_request).turn_on();
            } else {
              id(stop_request).turn_off();   // turn off emergency stop
              int select_scene = 1 + rand() % 3;   // random scene selection; type 1-3
              ESP_LOGI("buzzer", "randomly playing scene type: %d", select_scene);
              id(scene_controller)->execute(select_scene);
              // pushing the button, while nothing is playing = trigger a random scene
            }


sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    icon: mdi:wifi

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal %"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi

  - platform: bh1750
    name: "Umgebungshelligkeit"
    id: ambient_light
    address: 0x23
    update_interval: 30s

  - platform: ld2410
    moving_distance:
      name: "Radar Bewegung Entfernung"
      id: radar_moving_distance
      entity_category: "diagnostic"
      filters:
        - throttle_with_priority:
            timeout: 10s
            value:
              - nan
              - 0
    still_distance:
      name: "Radar statisch Entfernung"
      id: radar_static_distance
      entity_category: "diagnostic"
      filters:
        - throttle_with_priority:
            timeout: 10s
            value:
              - nan
              - 0
    moving_energy:
      name: "Radar Bewegung Energie"
      id: radar_moving_energy
      entity_category: "diagnostic"
      filters:
        - throttle_with_priority:
            timeout: 10s
            value:
              - nan
              - 0
    still_energy:
      name: "Radar statisch Energie"
      id: radar_static_energy
      entity_category: "diagnostic"
      filters:
        - throttle_with_priority:
            timeout: 10s
            value:
              - nan
              - 0
    g0:
      move_energy:
        name: "Radar G0 Bewegung"
        entity_category: "diagnostic"
        disabled_by_default: true
      still_energy:
        name: "Radar G0 statisch"
        entity_category: "diagnostic"
        disabled_by_default: true
    g1:
      move_energy:
        name: "Radar G1 Bewegung"
        entity_category: "diagnostic"
        disabled_by_default: true
      still_energy:
        name: "Radar G1 statisch"
        entity_category: "diagnostic"
        disabled_by_default: true

    detection_distance:
      name: "Bewegungserkennung Abstand"
      id: ld2410_distance
      filters:
        - throttle_with_priority:
            timeout: 10s
            value:
              - nan
              - 0
      on_value_range:
        - below: !lambda 'return id(action_distance).state;'
          then:
            - if:
                condition:
                  - lambda: |-
                      ESP_LOGI("illumination", "light measured: %f / light threshold: %f",
                        id(ambient_light).state, id(light_threshold).state);
                      return id(ambient_light).state <= id(light_threshold).state;
                  - lambda: |-
                      ESP_LOGI("time", "now: %02d:%02d:%02d / earliest trigger: %02d:%02d:%02d / latest trigger: %02d:%02d:%02d",
                              id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second,
                              id(earliest_trigger).hour, id(earliest_trigger).minute, id(earliest_trigger).second,
                              id(latest_trigger).hour, id(latest_trigger).minute, id(latest_trigger).second);
                      return id(within_time_window).state;
                  - lambda: |-
                      ESP_LOGI("scene_type", "current scene running: %d", id(scene_type_running));
                      return id(scene_type_running) == 2;
                      // only trigger, if scene type "approach" is running
                      // meaning somebody is approaching the entrance area
                      // triggers from opening the own door are excluded this way
                  - switch.is_off: stop_request
                then:
                  - logger.log:
                      format: "ACTION triggered. Distance: %.0f"
                      args: [ 'id(ld2410_distance).state' ]
                      level: INFO
                      tag: ld2410_distance
                  - script.execute:
                      id: scene_controller
                      scene_type: 3   # 3 = action
        - above: !lambda |-
            return id(departure_distance).state;
          then:
            - if:
                condition:
                  - lambda: |-
                      return id(ambient_light).state <
                            id(light_threshold).state;
                  - lambda: |-
                      return id(scene_type_running) != 1;
                      // trigger always, excluding scene type "music"
                  - switch.is_off: stop_request
                then:
                  - logger.log:
                      format: "LEAVING triggered. Distance: %.0f"
                      args: [ 'id(ld2410_distance).state' ]
                      level: INFO
                      tag: ld2410_distance
                  - script.execute:
                      id: scene_controller
                      scene_type: 4   # 4 = departure

