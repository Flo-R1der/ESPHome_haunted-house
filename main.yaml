substitutions:
  device_name: "horror-haus"  # only lowercase, numbers, - and _ allowed!
  friendly_name: "Horror-Haus"
  local_domain: ".fritz.box"


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  on_boot:
    - priority: -100
      then:
        - dfplayer.set_volume:
            volume: !lambda "return (int) round(id(volume).state * 30.0 / 100.0);"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption

  actions:
    # Play file from /mp3/xxxx.mp3
    - action: play_mp3
      variables:
        file: int
      then:
        - dfplayer.play_mp3:
            file: !lambda "return file;"
    # Play file from numbered folder, e.g. /01/001.mp3
    - action: play_folder
      variables:
        folder: int
        file: int
      then:
        - dfplayer.play_folder:
            folder: !lambda "return folder;"
            file: !lambda "return file;"
    # Control light partitions of WS2812B RGB LED Strip using bitmask
    - action: partition_light
      variables:
        partition_bits: int
        # 0 = all off
        # bit 0 = led_door
        # bit 1 = led_bay_1
        # bit 2 = led_small_window
        # bit 3 = led_bay_2
        # bit 4 = led_attic_1
        # bit 5 = led_attic_2
        brightness: int   # in %
        red: int     # range: 0-255
        green: int   # range: 0-255
        blue: int    # range: 0-255
      then:
        - script.execute:
            id: partition_light
            partition_bits: !lambda "return partition_bits;"
            brightness: !lambda "return brightness;"
            red: !lambda "return red;"
            green: !lambda "return green;"
            blue: !lambda "return blue;"
    # Call the scene_controller script as a sensor trigger would do
    - action: random_scene
      variables:
        scene_type: int
        # 0 = no scene
        # 1 = music only
        # 2 = approach (includes music)
        # 3 = action
        # 4 = departure
      then:
        - script.execute:
            id: scene_controller
            scene_type: !lambda "return scene_type;"
    # request a specific scene to be started
    - action: start_scene
      variables:
        scene_number: int
      then:
        - script.execute:
            id: scene_start_manual
            scene_number: !lambda "return scene_number;"
    # stop running scenes
    - action: stop_scene
      variables:
        stop_waiting_seconds: int
      then:
        - script.execute:
            id: stop_scene
            stop_waiting_seconds: !lambda "return stop_waiting_seconds;"


ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret wifi_wohnzimmer_ssid
    password: !secret wifi_wohnzimmer_password

  domain: "${local_domain}"
  use_address: 192.168.178.169

  output_power: 14dB   # https://esphome.io/guides/faq/#brownout-detector-was-triggered
  
  ap:
    ssid: "${device_name} Hotspot"
    password: !secret hotspot_password

captive_portal:


uart:
  - id: dfplayer_uart
    tx_pin: GPIO3
    rx_pin: GPIO1
    baud_rate: 9600
  - id: uart_ld2410
    tx_pin: GPIO17
    rx_pin: GPIO16
    parity: NONE
    stop_bits: 1
    baud_rate: 256000

dfplayer:
  uart_id: dfplayer_uart
  id: my_dfplayer

number:
  - platform: template
    name: "Volume"
    id: volume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    set_action:
      - dfplayer.set_volume:
          volume: !lambda "return (int) round(x * 30.0 / 100.0);"

button:
  - platform: template
    name: "Zufallswiedergabe"
    disabled_by_default: true
    icon: mdi:play
    on_press:
      - dfplayer.random

  - platform: template
    name: "Wiedergabe stoppen"
    disabled_by_default: true
    icon: mdi:stop
    on_press:
      - dfplayer.stop


packages:
  - !include lights.yaml
  - !include scenes/00_scene_controller.yaml


globals:
  - id: scene_type_running
    type: int
    restore_value: no
    initial_value: '0'
    # 0 = no scene
    # 1 = scene type "music" running
    # 2 = scene type "approach" running
    # 3 = scene type "action" running
    # 4 = scene type "departure" running

  - id: scene_running
    type: int
    restore_value: no
    initial_value: '0'
    # 0 = no scene selected
    # n = 

  - id: last_volume
    type: int
    restore_value: yes
    initial_value: '0'


switch:
  - platform: template
    name: "Stop Scene"
    id: stop_request
    optimistic: true
    icon: mdi:pause-box
    turn_on_action:
      - script.execute: 
          id: stop_scene
          stop_waiting_seconds: 0



ld2410:
  uart_id: uart_ld2410

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true


binary_sensor:
  - platform: status
    name: "Status"

  - platform: ld2410
    has_target:
      name: "Anwesenheit"
      filters:
        - delayed_on: 200ms
        - delayed_off: 30s

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    icon: mdi:wifi

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal %"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi

  - platform: ld2410
    detection_distance:
      name: "Bewegungserkennung Abstand"
      id: ld2410_distance
      filters:
        - throttle: 15s
        - timeout: 30s

  - platform: bh1750
    name: "Umgebungshelligkeit"
    id: ambient_light
    address: 0x23
    update_interval: 30s

