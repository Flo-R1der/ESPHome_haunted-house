          width: 30
      - addressable_random_twinkle:
          name: Disco
          twinkle_probability: 15%
          progress_interval: 12ms
  # led_small_window: LED 20-23
  - platform: partition
    id: led_small_window
    internal: true
    segments:
      - id: rgb_led_strip
        from: 19
        to: 22
  # led_bay_2: LED 26-37
  - platform: partition
    id: led_bay_2
    internal: true
    segments:
      - id: rgb_led_strip
        from: 25
        to: 36

  # led_attic: LED 38-54
  - platform: partition
    id: led_attic
    internal: true
    segments:
      - id: rgb_led_strip
        from: 37
        to: 53
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_attic),
            current_color,
            initial_run,
            id(color_wandering_length_ms),
            id(color_wandering_reversed)
            );
      - addressable_rainbow:
          name: Rainbow
          speed: 15
          width: 30
      - addressable_random_twinkle:
          name: Disco
          twinkle_probability: 15%
          progress_interval: 12ms
  # led_attic_1: LED 38-44
  - platform: partition
    id: led_attic_1
    internal: true
    segments:
      - id: rgb_led_strip
        from: 37
        to: 43
  # led_attic_2: LED 48-54
  - platform: partition
    id: led_attic_2
    internal: true
    segments:
      - id: rgb_led_strip
        from: 47
        to: 53


  - platform: esp32_rmt_led_strip
    id: rgb_led_strip
    name: "RGB LED Strip"
    icon: mdi:led-strip-variant
    pin: GPIO23
    num_leds: 54
    rgb_order: GRB
    chipset: WS2812
    #internal: true
    effects:
      - flicker:
          name: "Flicker"
          alpha: 95%
          intensity: 5%
      - addressable_lambda:
          name: "Color Wandering"
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(rgb_led_strip),
            current_color,
            initial_run,
            15000
            );


external_components:
  - source:
      type: local
      path: components
    components:
      - wandering_light
wandering_light:   # is required to activate the external component

globals:
  - id: color_wandering_length_ms
    type: int
    restore_value: no
    initial_value: '5000'
  - id: color_wandering_reversed
    type: bool
    restore_value: no
    initial_value: 'false'


select:
  - platform: template
    name: "Power-LED Effekt"
    id: power_led_effect
    icon: mdi:lightbulb-auto
    optimistic: true
    entity_category: "diagnostic"
    options:
      - "Aus"
      - "Kerzenflackern"
      - "Blitz"
    on_value:
      - if:
          condition:
            lambda: 'return i == 0;'
          then:
            - light.turn_off: power_led_1
            - light.turn_off: power_led_2
            - light.turn_off: power_led_3
            - light.turn_off: power_led_4
            - light.turn_off: power_led_5
      - if:
          condition:
            lambda: 'return i == 1;'
          then:
            - light.turn_on:
                id: power_led_1
                effect: flicker
                brightness: 35%
            - light.turn_on:
                id: power_led_2
                effect: flicker
                brightness: 35%
            - light.turn_on:
                id: power_led_3
                effect: flicker
                brightness: 35%
            - light.turn_on:
                id: power_led_4
                effect: flicker
                brightness: 35%
            - light.turn_on:
                id: power_led_5
                effect: flicker
                brightness: 35%
      - if:
          condition:
            lambda: 'return i == 2;'
          then:
            - light.turn_on:
                id: power_led_1
                effect: flash
                brightness: 90%
            - delay: 500ms
            - light.turn_on:
                id: power_led_2
                effect: flash
                brightness: 90%
            - delay: 500ms
            - light.turn_on:
                id: power_led_3
                effect: flash
                brightness: 90%
            - delay: 500ms
            - light.turn_on:
                id: power_led_4
                effect: flash
                brightness: 90%
            - delay: 500ms
            - light.turn_on:
                id: power_led_5
                effect: flash
                brightness: 90%
            - delay: 500ms
            - select.first: power_led_effect


script:
  - id: thunder
    mode: parallel
    parameters:
      pause_array: int[]
      power_led_no: int
    then:
      - repeat:
          count: !lambda 'return pause_array.size();'
          then:
            - lambda: |-
                if (power_led_no == 1) {
                  id(power_led_1).turn_on().set_brightness(1.0).set_effect("flash").perform();
                } else if (power_led_no == 2) {
                  id(power_led_2).turn_on().set_brightness(1.0).set_effect("flash").perform();
                } else if (power_led_no == 3) {
                  id(power_led_3).turn_on().set_brightness(1.0).set_effect("flash").perform();
                } else if (power_led_no == 4) {
                  id(power_led_4).turn_on().set_brightness(1.0).set_effect("flash").perform();
                } else if (power_led_no == 5) {
                  id(power_led_5).turn_on().set_brightness(1.0).set_effect("flash").perform();
                } else {
                  ESP_LOGW("thunder", "Unknown LED No: %d", power_led_no);
                }
            - delay: !lambda |-
                return pause_array[iteration];
      - lambda: |-
          if (power_led_no == 1) {
            id(power_led_1).turn_on().set_brightness(1.0).set_effect("flash").perform();
          } else if (power_led_no == 2) {
            id(power_led_2).turn_on().set_brightness(1.0).set_effect("flash").perform();
          } else if (power_led_no == 3) {
            id(power_led_3).turn_on().set_brightness(1.0).set_effect("flash").perform();
          } else if (power_led_no == 4) {
            id(power_led_4).turn_on().set_brightness(1.0).set_effect("flash").perform();
          } else if (power_led_no == 5) {
            id(power_led_5).turn_on().set_brightness(1.0).set_effect("flash").perform();
          } else {
            ESP_LOGW("thunder", "Unknown LED No: %d", power_led_no);
          }

  - id: partition_light
    mode: queued
    parameters:
      partition_bits: int
      brightness: float   # 0-100
      red: float          # 0-255
      green: float        # 0-255
      blue: float         # 0-255
    then:
      - lambda: |-
          ESP_LOGD("partition_light",
          "bits=%d, brightness=%.1f, RGB=%.1f/%.1f/%.1f",
          partition_bits, brightness, red, green, blue);

          if (partition_bits == 0) {
            id(led_door).turn_off().perform();
            id(led_bay_1).turn_off().perform();
            id(led_small_window).turn_off().perform();
            id(led_bay_2).turn_off().perform();
            id(led_attic_1).turn_off().perform();
            id(led_attic_2).turn_off().perform();
            return;
          }
          if (partition_bits & 1) {   // led_door
            auto call_1 = id(led_door).turn_on().set_brightness(brightness/100.0f);
            call_1.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }
          if (partition_bits & 2) {   // led_bay_1
            auto call_2 = id(led_bay_1).turn_on().set_brightness(brightness/100.0f);
            call_2.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }
          if (partition_bits & 4) {   // led_small_window
            auto call_3 = id(led_small_window).turn_on().set_brightness(brightness/100.0f);
            call_3.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }
          if (partition_bits & 8) {   // led_bay_2
            auto call_4 = id(led_bay_2).turn_on().set_brightness(brightness/100.0f);
            call_4.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }
          if (partition_bits & 16) {   // led_attic_1
            auto call_5 = id(led_attic_1).turn_on().set_brightness(brightness/100.0f);
            call_5.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }
          if (partition_bits & 32) {   // led_attic_1
            auto call_6 = id(led_attic_2).turn_on().set_brightness(brightness/100.0f);
            call_6.set_rgb(red/255.0f, green/255.0f, blue/255.0f).set_effect("none").perform();
          }

