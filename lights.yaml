  # WS2812B RGB LED Strip
  # Erdgeschoss: LED 01-19
  - platform: partition
    id: led_basement
    internal: true
    segments:
      - id: rgb_led_strip
        from: 0
        to: 18
    effects:
      - addressable_lambda:
          name: color_wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_basement),
            current_color,
            initial_run,
            id(color_wandering_length)
            );
  # Tür: LED 01-09
  - platform: partition
    id: led_door
    internal: true
    segments:
      - id: rgb_led_strip
        from: 0
        to: 8
  # Erker 1: LED 12-19
  - platform: partition
    id: led_bay_1
    internal: true
    segments:
      - id: rgb_led_strip
        from: 11
        to: 18

  # Wohnräume: LED 20-37
  - platform: partition
    id: led_livingroom
    internal: true
    segments:
      - id: rgb_led_strip
        from: 19
        to: 36
    effects:
      - addressable_lambda:
          name: color_wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_livingroom),
            current_color,
            initial_run,
            id(color_wandering_length)
            );
  # Mini-Fenster: LED 20-23
  - platform: partition
    id: led_small_window
    internal: true
    segments:
      - id: rgb_led_strip
        from: 19
        to: 22
  # Erker 2: LED 26-37
  - platform: partition
    id: led_bay_2
    internal: true
    segments:
      - id: rgb_led_strip
        from: 25
        to: 36

  # Dachgeschoss: LED 38-54
  - platform: partition
    id: led_attic
    internal: true
    segments:
      - id: rgb_led_strip
        from: 37
        to: 53
    effects:
