            id(color_wandering_length)
            );
  # Dachfenster 1: LED 38-44
  - platform: partition
    id: led_roof_1
    internal: true
    segments:
      - id: rgb_led_strip
        from: 37
        to: 43
  # Dachfenster 2: LED 48-54
  - platform: partition
    id: led_roof_2
    internal: true
    segments:
      - id: rgb_led_strip
        from: 47
        to: 53


  - platform: esp32_rmt_led_strip
    id: rgb_led_strip
    name: "RGB LED Strip"
    icon: mdi:led-strip-variant
    pin: GPIO23
    num_leds: 54
    rgb_order: GRB
    chipset: WS2812
    #internal: true
    effects:
      - flicker:
          name: "Flicker"
          alpha: 95%
          intensity: 4%
      - addressable_lambda:
          name: "Color Wandering"
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(rgb_led_strip),
            current_color,
            initial_run,
            15000
            );


external_components:
  - source:
      type: local
      path: components
    components:
      - wandering_light
wandering_light:   # is required to activate the external component

globals:
  - id: color_wandering_length
    type: uint32_t
    restore_value: no
    initial_value: '5000'


script:
  - id: partition_light
    parameters:
      partition_bits: int
      brightness: float
      red: float
      green: float
      blue: float
    then:
      # 0 = all off
      - if:
          condition:
            lambda: 'return partition_bits == 0;'
          then:
            - light.turn_off:
                id: led_door
            - light.turn_off:
                id: led_bay_1
            - light.turn_off:
                id: led_small_window
            - light.turn_off:
                id: led_bay_2
            - light.turn_off:
                id: led_roof_1
            - light.turn_off:
                id: led_roof_2

      # bit 0 = led_door
      - if:
          condition:
            lambda: 'return partition_bits & 1;'
          then:
            - light.turn_on:
                id: led_door
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

      # bit 1 = led_bay_1
      - if:
          condition:
            lambda: 'return partition_bits & 2;'
          then:
            - light.turn_on:
                id: led_bay_1
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

      # bit 2 = led_small_window
      - if:
          condition:
            lambda: 'return partition_bits & 4;'
          then:
            - light.turn_on:
                id: led_small_window
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

      # bit 3 = led_bay_2
      - if:
          condition:
            lambda: 'return partition_bits & 8;'
          then:
            - light.turn_on:
                id: led_bay_2
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

      # bit 4 = led_roof_1
      - if:
          condition:
            lambda: 'return partition_bits & 16;'
          then:
            - light.turn_on:
                id: led_roof_1
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

      # bit 5 = led_roof_2
      - if:
          condition:
            lambda: 'return partition_bits & 32;'
          then:
            - light.turn_on:
                id: led_roof_2
                brightness: !lambda 'return brightness/100;'
                red: !lambda 'return red/255;'
                green: !lambda 'return green/255;'
                blue: !lambda 'return blue/255;'

