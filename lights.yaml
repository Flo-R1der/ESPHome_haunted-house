  # WS2812B RGB LED Strip
  # led_basement: LED 01-19
  - platform: partition
    id: led_basement
    internal: true
    segments:
      - id: rgb_led_strip
        from: 0
        to: 18
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_basement),
            current_color,
            initial_run,
            id(color_wandering_length_ms),
            id(color_wandering_reversed)
            );
  # led_door: LED 01-09
  - platform: partition
    id: led_door
    internal: true
    default_transition_length: 0s
    segments:
      - id: rgb_led_strip
        from: 0
        to: 8
  # led_bay_1: LED 12-19
  - platform: partition
    id: led_bay_1
    internal: true
    default_transition_length: 0s
    segments:
      - id: rgb_led_strip
        from: 11
        to: 18

  # led_livingroom: LED 20-37
  - platform: partition
    id: led_livingroom
    internal: true
    segments:
      - id: rgb_led_strip
        from: 19
        to: 36
        reversed: true
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_livingroom),
            current_color,
            initial_run,
            id(color_wandering_length_ms),
            id(color_wandering_reversed)
            );
  # led_small_window: LED 20-23
  - platform: partition
    id: led_small_window
    internal: true
    default_transition_length: 0s
    segments:
      - id: rgb_led_strip
        from: 19
        to: 22
  # led_bay_2: LED 26-37
  - platform: partition
    id: led_bay_2
    internal: true
    default_transition_length: 0s
    segments:
      - id: rgb_led_strip
        from: 25
        to: 36

  # led_attic: LED 38-54
  - platform: partition
    id: led_attic
    internal: true
    segments:
      - id: rgb_led_strip
        from: 37
        to: 53
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
