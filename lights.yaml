  # WS2812B RGB LED Strip
  # led_basement: LED 01-19
  - platform: partition
    id: led_basement
    internal: true
    segments:
      - id: rgb_led_strip
        from: 0
        to: 18
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_basement),
            current_color,
            initial_run,
            id(color_wandering_length_ms),
            id(color_wandering_reversed)
            );
      - addressable_rainbow:
          name: Rainbow
          speed: 15
          width: 30
      - addressable_random_twinkle:
          name: Disco
          twinkle_probability: 15%
          progress_interval: 12ms
  # led_door: LED 01-09
  - platform: partition
    id: led_door
    internal: true
    segments:
      - id: rgb_led_strip
        from: 0
        to: 8
  # led_bay_1: LED 12-19
  - platform: partition
    id: led_bay_1
    internal: true
    segments:
      - id: rgb_led_strip
        from: 11
        to: 18

  # led_livingroom: LED 20-37
  - platform: partition
    id: led_livingroom
    internal: true
    segments:
      - id: rgb_led_strip
        from: 19
        to: 36
        reversed: true
    default_transition_length: 1s
    effects:
      - addressable_lambda:
          name: Color Wandering
          update_interval: 50ms
          lambda: |-
            esphome::wandering_light_fx::color_wandering(
            &it,
            id(led_livingroom),
            current_color,
            initial_run,
            id(color_wandering_length_ms),
